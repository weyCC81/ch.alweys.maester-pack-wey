# Gives every pull request to main the next version of each pack it changes, so merging it lands those versions on
# main. The label on the pull request picks the part to raise, for every changed pack:
#   release:major, release:minor, release:patch (the default when there is no label), or release:none.
# When the pull request is opened, updated or relabelled, it sets Version in each changed pack's maester-pack.json one
# step above that pack's version on main, turns "## Unreleased" in its CHANGELOG.md into that version, and pushes
# the commit to the pull request. Pull the branch before you push to it again. If main moves on, updating the pull
# request raises it again. A pack is a top-level folder with a maester-pack.json; a pack new on this branch keeps
# the version it has.
#
# A push made with the workflow's token starts no other workflow, so the pack check would never run on the new
# commit. This workflow runs it (check-pack.yml) on that commit and reports the result as the "check" the ruleset
# requires. It runs for branches of this repository only; a pull request from a fork is raised by hand.
#
# It runs only when the repository variable PACK_RELEASES is true, with release.yml. Without it the packs have no
# releases and Install-MtPack installs the default branch. See "Versions and releases" in powerdmarc/README.md.
name: Bump version

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

concurrency:
  group: bump-version-${{ github.event.pull_request.number }}

jobs:
  bump:
    if: >-
      vars.PACK_RELEASES == 'true' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      # No credentials are kept while the branch's files are read; git gets them only for the push at the end.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Raise the versions
        id: bump
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # Read the labels now, not from the event, so the latest label counts.
          $labels = @(gh pr view $env:PR_NUMBER --json labels --jq '.labels[].name')
          if ($labels -contains 'release:none') {
            Write-Output 'The pull request has release:none: the versions stay as they are.'
            return
          }
          $part = if ($labels -contains 'release:major') { 'major' } elseif ($labels -contains 'release:minor') { 'minor' } else { 'patch' }

          # The checkout kept no credentials: gh lends git the workflow token for the fetch and the push below.
          gh auth setup-git
          git fetch --quiet origin main

          # The packs this pull request changes: top-level folders with a maester-pack.json.
          $changed = @(git diff --name-only origin/main...HEAD | ForEach-Object { ($_ -split '/')[0] } | Sort-Object -Unique |
            Where-Object { $_ -match '^[A-Za-z0-9._-]+$' -and (Test-Path -LiteralPath (Join-Path $_ 'maester-pack.json') -PathType Leaf) })
          if (-not $changed) {
            Write-Output 'The pull request changes no pack.'
            return
          }

          $raised = [System.Collections.Generic.List[string]]::new()
          foreach ($pack in $changed) {
            $mainManifest = git show "origin/main:$pack/maester-pack.json" 2>$null
            if ($LASTEXITCODE -ne 0 -or -not $mainManifest) {
              $global:LASTEXITCODE = 0
              Write-Output "$pack is new on this branch: its version stays as it is."
              continue
            }
            $base = [version](($mainManifest -join "`n") | ConvertFrom-Json).Version
            $manifestPath = Join-Path $pack 'maester-pack.json'
            $logPath = Join-Path $pack 'CHANGELOG.md'
            $text = Get-Content -LiteralPath $manifestPath -Raw
            $current = [version]($text | ConvertFrom-Json).Version
            $next = switch ($part) {
              'major' { '{0}.0.0' -f ($base.Major + 1) }
              'minor' { '{0}.{1}.0' -f $base.Major, ($base.Minor + 1) }
              default { '{0}.{1}.{2}' -f $base.Major, $base.Minor, ([math]::Max($base.Build, 0) + 1) }
            }
            if ($current -eq [version]$next) {
              Write-Output "$pack is already $next ($part above $base on main)."
              continue
            }

            # Change only the value of the manifest's own Version, so the rest of the file keeps its layout.
            $text = ([regex]'("Version"\s*:\s*")[^"]*(")').Replace($text, "`${1}$next`${2}", 1)
            if (($text | ConvertFrom-Json).Version -ne $next) { throw "Could not change Version in $manifestPath." }
            [System.IO.File]::WriteAllText((Resolve-Path -LiteralPath $manifestPath), $text)

            # The changelog: "## Unreleased" becomes the version. A heading this workflow wrote before (the label
            # changed, or main moved on) moves to the new version. Without either, the pull request's title is the entry.
            if (Test-Path -LiteralPath $logPath -PathType Leaf) {
              $log = Get-Content -LiteralPath $logPath -Raw
              $unreleased = [regex]'(?m)^## Unreleased[ \t]*\r?$'
              $earlier = [regex]('(?m)^## ' + [regex]::Escape([string]$current) + '[ \t]*\r?$')
              $mainLog = (git show "origin/main:$pack/CHANGELOG.md" 2>$null) -join "`n"
              $global:LASTEXITCODE = 0
              if ($unreleased.IsMatch($log)) {
                $log = $unreleased.Replace($log, "## $next", 1)
              } elseif ($current -gt $base -and $earlier.IsMatch($log) -and -not $earlier.IsMatch($mainLog)) {
                $log = $earlier.Replace($log, "## $next", 1)
              } else {
                $entry = "## $next`n`n- $env:PR_TITLE (#$env:PR_NUMBER)`n`n"
                $first = [regex]::Match($log, '(?m)^## ')
                $log = if ($first.Success) { $log.Insert($first.Index, $entry) } else { $log.TrimEnd() + "`n`n" + $entry }
              }
              [System.IO.File]::WriteAllText((Resolve-Path -LiteralPath $logPath), $log)
            }

            git add -- $manifestPath
            if (Test-Path -LiteralPath $logPath -PathType Leaf) { git add -- $logPath }
            $raised.Add("$pack $next")
            "Set **$pack** to **$next** ($part above $base on main)." >> $env:GITHUB_STEP_SUMMARY
          }
          if ($raised.Count -eq 0) { return }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --quiet -m "Version $($raised -join ', ')"
          git push --quiet origin "HEAD:$($env:HEAD_REF)"
          if ($LASTEXITCODE -ne 0) { throw 'Could not push the version commit.' }
          "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          "version=$($raised -join ', ')" >> $env:GITHUB_OUTPUT

  validate:
    needs: bump
    if: needs.bump.outputs.sha != ''
    permissions:
      contents: read
    uses: ./.github/workflows/check-pack.yml
    with:
      ref: ${{ needs.bump.outputs.sha }}

  report:
    needs: [bump, validate]
    if: always() && needs.bump.outputs.sha != ''
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Report the check on the new commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.bump.outputs.sha }}
          VERSION: ${{ needs.bump.outputs.version }}
          RESULT: ${{ needs.validate.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          conclusion=failure
          if [ "$RESULT" = "success" ]; then conclusion=success; fi
          gh api "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name=check -f head_sha="$SHA" -f status=completed -f conclusion="$conclusion" -f details_url="$RUN_URL" \
            -f "output[title]=Pack check of $VERSION: $RESULT" \
            -f "output[summary]=The version commit was checked by the Bump version run: $RUN_URL"
